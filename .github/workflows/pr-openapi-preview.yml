name: PR OpenAPI Preview

# Baut bei jeder PR-Änderung an der Spezifikation eine eigenständige Swagger-UI-Datei
# und hängt sie als Download-Artefakt an den PR. Macht nichts öffentlich.

on:
  pull_request:
    paths:
      - openapi/**
      - .github/workflows/pr-openapi-preview.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swagger-UI-Datei mit eingebetteter Spec bauen
        run: |
          npx --yes js-yaml@4 openapi/dms-api.v1.yaml > spec.json
          cat > template.html <<'HTML'
          <!doctype html>
          <html lang="de">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>W&amp;W Immo DMS-API – Referenz</title>
              <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
              <style>body { margin: 0; }</style>
            </head>
            <body>
              <div id="swagger-ui"></div>
              <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
              <script>
                window.onload = () => {
                  window.ui = SwaggerUIBundle({ spec: __SPEC__, dom_id: '#swagger-ui', deepLinking: true });
                };
              </script>
            </body>
          </html>
          HTML
          python3 - <<'PY'
          html = open('template.html', encoding='utf-8').read()
          spec = open('spec.json', encoding='utf-8').read()
          open('dms-api-swagger.html', 'w', encoding='utf-8').write(html.replace('__SPEC__', spec))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dms-api-swagger
          path: dms-api-swagger.html

      - name: PR-Kommentar mit Anleitung
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- openapi-preview -->';
            const body = [
              marker,
              '### 📖 OpenAPI-Referenz (Swagger UI) – Vorschau für diesen PR',
              '',
              'Für diesen Stand wurde eine eigenständige Swagger-UI-Datei gebaut (nichts wird öffentlich).',
              '',
              `**So ansehen:** [Workflow-Run öffnen](${runUrl}) → unten unter **Artifacts** ` +
              '`dms-api-swagger` herunterladen → ZIP entpacken → `dms-api-swagger.html` im Browser öffnen.',
              '',
              '_Wird bei jeder Änderung an `openapi/` neu gebaut._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
