name: PR OpenAPI Preview

# Prüft jeden PR, der Spezifikation, Doku, Bruno-Collection oder Skripte berührt:
# Redocly-Lint der Spezifikation, Abgleich der Prosa und der Bruno-Requests gegen die
# Spezifikation (scripts/check-docs-against-spec.py) und eine eigenständige Swagger-UI-Datei
# als Download-Artefakt. Macht nichts öffentlich.

on:
  pull_request:
    paths:
      - openapi/**
      - docs/**
      - bruno/**
      - README.md
      - scripts/**
      - redocly.yaml
      - .github/workflows/pr-openapi-preview.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml

      - name: OpenAPI validieren (Redocly)
        run: npx --yes @redocly/cli@2 lint

      - name: Doku und Bruno-Collection gegen die Spezifikation prüfen
        run: python scripts/check-docs-against-spec.py

      - name: Swagger-UI-Datei mit eingebetteter Spec bauen
        run: scripts/build-swagger-html.sh openapi/dms-api.v1.yaml dms-api-swagger.html

      - uses: actions/upload-artifact@v4
        with:
          name: dms-api-swagger
          path: dms-api-swagger.html

      - name: PR-Kommentar mit Anleitung
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- openapi-preview -->';
            const body = [
              marker,
              '### 📖 OpenAPI-Referenz (Swagger UI) – Vorschau für diesen PR',
              '',
              'Für diesen Stand wurde eine eigenständige Swagger-UI-Datei gebaut (nichts wird öffentlich).',
              '',
              `**So ansehen:** [Workflow-Run öffnen](${runUrl}) → unten unter **Artifacts** ` +
              '`dms-api-swagger` herunterladen → ZIP entpacken → `dms-api-swagger.html` im Browser öffnen.',
              '',
              '_Wird bei jeder Änderung an `openapi/`, `docs/`, `bruno/` oder den Skripten neu gebaut._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
