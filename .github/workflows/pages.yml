name: Pages

# Veröffentlicht die OpenAPI-Referenz (Swagger UI) auf GitHub Pages.
# Voraussetzung: GitHub Pages aktiviert (Settings → Pages → Source "GitHub Actions").
# Pages braucht ein öffentliches Repo bzw. einen Team/Enterprise-Plan.
#
# Solange Pages noch nicht aktiv ist, läuft dieser Workflow NUR manuell
# (workflow_dispatch), damit auf `main` keine fehlschlagenden Deploys entstehen.
# Sobald das Repo öffentlich ist und Pages aktiviert wurde, den Push-Trigger
# wieder einkommentieren:
#
#   push:
#     branches: [main]
#     paths:
#       - openapi/**
#       - .github/workflows/pages.yml

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Die Swagger-UI-Seite (index.html) und die Spezifikation liegen in openapi/.
          path: ./openapi
      - id: deployment
        uses: actions/deploy-pages@v4
