name: Pages

# Veröffentlicht die OpenAPI-Referenz (Swagger UI) auf GitHub Pages.
# Voraussetzung: In den Repo-Einstellungen unter Settings → Pages die Quelle
# "GitHub Actions" auswählen.

on:
  push:
    branches: [main]
    paths:
      - openapi/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Die Swagger-UI-Seite (index.html) und die Spezifikation liegen in openapi/.
          path: ./openapi
      - id: deployment
        uses: actions/deploy-pages@v4
