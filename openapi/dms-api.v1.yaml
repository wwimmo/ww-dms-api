      tags:
      - Document
      summary: Lists documents changed in the given window, newest data first.
      description: |-
        Add the flag `requires_dms_archiving` (no value needed) to get only documents that still
        need archiving, i.e. `storageTargets` contains `DMS` and `dmsReference` is unset.
      parameters:
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: changed_until
        in: query
        schema:
          type: string
          format: date-time
