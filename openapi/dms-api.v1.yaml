      tags:
      - Creditor
      summary: Lists creditors changed in the given window, paginated.
      description: |-
        The delta window is forwarded to the ERP, which filters at the source (the ImmoTop2 DMS API accepts
        `changed_since`/`changed_until` on all financial domains). Partners can therefore poll with
        their stored watermark. Pagination still happens in memory because the provider returns the window
        as one list.
      parameters:
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: changed_until
