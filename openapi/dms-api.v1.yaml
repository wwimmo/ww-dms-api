openapi: 3.0.1
info:
  title: DMS API
  description: |-
    REST API for the Document Management System (DMS).

    ## Rate Limiting

    All DMS endpoints are rate-limited. Two policies apply depending on authentication:

    | Policy | Algorithm | Default Limit | Queue |
    |--------|-----------|---------------|-------|
    | Anonymous (e.g. /token, /health) | Fixed Window | 30 req/min per IP | 2 |
    | Authenticated (data endpoints) | Token Bucket | 100 burst, 50 req/min per client | 5 |

    When rate-limited, the API returns **HTTP 429** ("Rate limit exceeded") with a `Retry-After`
    header (seconds). Limits are configurable via the `RateLimiting:Dms` configuration section.

    ## Retry Strategy

    Consumers **should** implement Exponential Backoff with jitter:
    1. Wait for `Retry-After` seconds (or 1s if absent).
    2. On repeated 429s, double the delay: 1s → 2s → 4s → 8s.
    3. Add ±25% random jitter to avoid thundering-herd effects.
    4. Abort after 5 retries (~30s total).

    ## Delta Queries

    List endpoints take an optional UTC window: `changed_since` (default: no lower bound → full
    load) and `changed_until` (default: no upper bound). Sending `changed_since` alone is the
    normal polling pattern. `changed_since` after `changed_until` is rejected with **400**.

    The following endpoints accept the window but **cannot apply it** — their ERP source carries no
    change timestamps, so every call returns the full set: `/accounts`, `/account-cost-centers`,
    `/cost-centers`, `/creditors`, `/payment-accounts`, `/payoutbankaccounts`, `/vat-codes`,
    `/accountings-history`. Poll these on a slower schedule and diff locally.

    Deletions are not published: a removed document or master-data record simply stops appearing.
    There are no tombstones and no webhooks — every consumer polls.

    ## Error Format

    Errors use problem details (`type`, `title`, `status`, `detail`, `traceId`); field-level
    validation adds an `errors` map. The one exception is invoice validation
    (`POST /invoices`), which returns `{ "isValid": false, "errors": [{ field, code, message }] }`
    so callers can branch on stable codes such as `AMOUNT_MISMATCH` or `QR_IBAN_REQUIRES_REFERENCE`.
