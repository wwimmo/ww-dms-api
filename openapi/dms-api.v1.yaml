            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Document
      summary: Archives a document in the ERP and returns the id to store on the DMS side.
      description: |-
        Links must point at existing Stammdaten of the calling customer (`realestate`, `house`,
        `unit`, `appliance`, `tenant`, `tenancy`); an unknown id is rejected with 400.
        A retry after a timeout creates a second document — there is no idempotency key yet.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/dms/documents/{uuid}:
    get:
      tags:
      - Document
      summary: Reads a single document. Sends an `ETag`; honours `If-None-Match` with 304.
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '304':
          description: Not Modified
    put:
      tags:
      - Document
      summary: Replaces a document completely.
      description: |-
        This is a full replacement: properties missing from the body are cleared, so `links` and
        `storageTargets` have to be sent along. To change single properties — the archiving hand-back
        in particular — use `PATCH`. Send `If-Match` with the document's ETag to be told (412)
        instead of overwriting a version you have not seen.
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Client Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - Document
      summary: Updates single properties of a document; omitted properties stay as they are.
      description: |-
        Partial update: omitted properties keep their stored value. This is the endpoint for the DMS
        archiving hand-back (`{ "dmsReference": { … } }`) — unlike `PUT`, which replaces the whole
        document and therefore clears `links` and `storageTargets` when they are not sent along.
        An explicit `null` also means "unchanged"; clearing a field is done with `PUT`.
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DocumentPatchRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DocumentPatchRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Client Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - Document
      summary: Deletes a document in the ERP. Honours `If-Match`.
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
