          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        pageCount:
          type: integer
          description: Total number of pages for the current page size.
          format: int32
          readOnly: true
      additionalProperties: false
      description: Paginated REST envelope returned by the DMS BFF to its external consumer.
