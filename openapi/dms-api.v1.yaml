          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        pageCount:
          type: integer
          description: Total number of pages for the current page size.
          format: int32
          readOnly: true
      additionalProperties: false
      description: Paginated REST envelope returned by the DMS BFF to its external consumer.
    CallerInfo:
      type: object
      properties:
        type:
          type: string
          description: 'Type of caller: "User" for user tokens, "M2M" for machine-to-machine tokens.'
          nullable: true
        subject:
          type: string
          description: Subject claim (sub) - present in user tokens.
          nullable: true
        clientId:
          type: string
          description: Client ID - present in M2M tokens (client_id or azp claim).
          nullable: true
        email:
          type: string
          description: Email claim - may be present in user tokens.
          nullable: true
        customerId:
          type: string
          description: Customer ID claim - used for multi-tenant isolation.
          nullable: true
      additionalProperties: false
      description: Information about the authenticated caller extracted from the JWT token.
    ClientCredentialsTokenRequest:
      required:
      - client_id
      - client_secret
      type: object
      properties:
        client_id:
          minLength: 1
          type: string
          description: The client ID of the Cidaas application.
        client_secret:
          minLength: 1
          type: string
          description: The client secret of the Cidaas application.
      additionalProperties: false
      description: |-
        Request contract for exchanging client credentials for a DMS API access token.
        The client_id and client_secret are obtained from the Cidaas identity provider
        when a non-interactive application is created for a customer.
        JSON property names and validation attributes are mirrored verbatim from the legacy contract.
    CostCenterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        short:
          type: string
          nullable: true
      additionalProperties: false
      description: DMS REST response shape for an ERP cost center (frozen wire contract for the external
        DMS consumer).
    CostCenterResponsePaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CostCenterResponse'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        pageCount:
          type: integer
          description: Total number of pages for the current page size.
          format: int32
          readOnly: true
      additionalProperties: false
      description: Paginated REST envelope returned by the DMS BFF to its external consumer.
    CreditorRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the creditor.
          nullable: true
        number:
          type: integer
          description: Human-readable creditor number (nullable).
          format: int32
          nullable: true
        personid:
          type: string
          description: FK to the person carrying name/address/contact details.
          format: uuid
        vatuid:
          type: string
          description: VAT UID of the creditor (e.g. "CHE-123.456.789 MWST", max 28 chars, nullable).
          nullable: true
      additionalProperties: false
      description: |-
        Request contract for creating an ERP creditor (Polaris, wiki 2476). Name/address/contact details are
        managed on the linked person (WWImmo.Polaris.Dms.Endpoints.Creditors.CreditorRequest.Personid), not on the creditor.
    CreditorResponse:
      type: object
      properties:
        id:
          type: string
          description: Universal unique identifier of the creditor.
          format: uuid
        name:
          type: string
          description: Display name of the creditor.
          nullable: true
        number:
          type: integer
          description: Human-readable creditor number (nullable).
          format: int32
          nullable: true
        personid:
          type: string
          description: FK to the person with name/address/contact details (resolve via /persons).
          format: uuid
        active:
          type: boolean
          description: Whether the creditor is active in the ERP (E-006).
        vatuid:
          type: string
          description: VAT UID of the creditor (e.g. "CHE-123.456.789 MWST", max 28 chars).
          nullable: true
      additionalProperties: false
      description: DMS REST response shape for a creditor (frozen wire contract for the external DMS consumer).
    CreditorResponsePaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditorResponse'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        pageCount:
          type: integer
          description: Total number of pages for the current page size.
          format: int32
          readOnly: true
      additionalProperties: false
      description: Paginated REST envelope returned by the DMS BFF to its external consumer.
    DmsReferenceRequest:
      type: object
      properties:
        archive:
          type: string
          nullable: true
        documentId:
          type: string
          nullable: true
      additionalProperties: false
      description: DMS archive reference in a request.
    DmsReferenceResponse:
      type: object
      properties:
        archive:
          type: string
          nullable: true
        documentId:
          type: string
          nullable: true
      additionalProperties: false
      description: DMS archive reference (set after archiving).
    DocumentLinkRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity-type:
          type: string
          nullable: true
      additionalProperties: false
      description: Link between a document and a master-data entity in a request.
    DocumentLinkResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity-type:
          type: string
          nullable: true
      additionalProperties: false
      description: Link between a document and a master-data entity.
    DocumentPatchRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        filedate:
          type: string
          format: date-time
          nullable: true
        type:
          type: string
          nullable: true
        mime-type:
          type: string
          nullable: true
        extention:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        storageTargets:
          type: array
          items:
            type: string
          nullable: true
        dmsReference:
          $ref: '#/components/schemas/DmsReferenceRequest'
        links:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLinkRequest'
          nullable: true
      additionalProperties: false
      description: "Partial-update contract for an ERP document. Every property is optional and an omitted\
        \ property\nleaves the stored value untouched — the archiving hand-back the DMS concept describes\n\
        (`{ \"dmsReference\": { … } }`) is exactly this shape.\n            \nDeviation from RFC 7396\
        \ worth knowing: an explicit `null` also means \"unchanged\", it does not\nclear the field. Clearing\
        \ `links`, `storageTargets`, `url` or `barcode` stays the\njob of `PUT`, which replaces the whole\
        \ document. That keeps the dangerous operation explicit:\na partner who only wants to report an\
        \ archive reference cannot accidentally drop the links."
    DocumentRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        filedate:
          type: string
          format: date-time
        type:
          type: string
          nullable: true
        mime-type:
          type: string
          nullable: true
        extention:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        storageTargets:
          type: array
          items:
            type: string
          nullable: true
        dmsReference:
          $ref: '#/components/schemas/DmsReferenceRequest'
        links:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLinkRequest'
          nullable: true
      additionalProperties: false
      description: Request contract for creating or updating an ERP document.
    DocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        filedate:
          type: string
          format: date-time
        type:
          type: string
          nullable: true
        mime-type:
          type: string
          nullable: true
        extention:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        storageTargets:
          type: array
          items:
            type: string
          nullable: true
        dmsReference:
          $ref: '#/components/schemas/DmsReferenceResponse'
        links:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLinkResponse'
          nullable: true
      additionalProperties: false
      description: DMS REST response for a single ERP document (frozen wire contract for the external
        DMS consumer).
