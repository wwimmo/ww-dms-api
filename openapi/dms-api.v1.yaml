openapi: 3.0.1
info:
  title: DMS API
  description: |-
    REST API for the Document Management System (DMS).

    ## Rate Limiting

    All DMS endpoints are rate-limited. Two policies apply depending on authentication:

    | Policy | Algorithm | Default Limit | Queue |
    |--------|-----------|---------------|-------|
    | Anonymous (e.g. /token, /health) | Fixed Window | 30 req/min per IP | 2 |
    | Authenticated (data endpoints) | Token Bucket | 100 burst, 50 req/min per client | 5 |

    When rate-limited, the API returns **HTTP 429** with a `Retry-After` header (seconds).
    Limits are configurable via the `RateLimiting:Dms` configuration section.

    ## Retry Strategy

    Consumers **should** implement exponential backoff with jitter:
    1. Wait for `Retry-After` seconds (or 1s if absent).
    2. On repeated 429s, double the delay: 1s → 2s → 4s → 8s.
    3. Add ±25% random jitter to avoid thundering-herd effects.
    4. Abort after 5 retries (~30s total).
  version: v1
servers:
- url: https://erp-test.wwimmo.ch
  description: Test
paths:
  /api/v1/dms/health:
    get:
      tags:
      - DMS
      summary: Get DMS service health status
      description: |-
        Returns the current health status of the Document Management System service.
        Checks real dependencies (database). Returns 503 if any dependency is unhealthy.
        This endpoint is publicly accessible for health monitoring.
      operationId: GetDmsHealth
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per 1 minute
              schema:
                type: integer
              example: 30
            X-RateLimit-Remaining:
              description: Remaining requests in current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the rate limit resets
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          description: |-
            Rate limit exceeded. Limit: 30 requests per 1 minute.
            The response includes a Retry-After header indicating the number of seconds to wait.

            **Recommended retry strategy — Exponential Backoff with Jitter:**
            1. Wait for the duration specified in the `Retry-After` header (or 1 second if absent).
            2. On subsequent failures, double the wait time: 1s → 2s → 4s → 8s → …
            3. Add random jitter (±25%) to each delay to avoid thundering-herd effects.
            4. Set a maximum of 5 retries (or ~30 seconds total wait) before aborting.

            Example (pseudocode):
            ```
            delay = max(retryAfterHeader, 1)
            for attempt in 1..5:
                sleep(delay * (0.75 + random(0, 0.5)))
                response = retry(request)
                if response.status != 429: break
                delay = delay * 2
            ```
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
