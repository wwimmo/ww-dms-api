      - DMS
      summary: Exchange client credentials for an access token
      description: |-
        Proxies an OAuth2 client_credentials grant to the Cidaas OIDC provider.
        Send your client_id and client_secret to receive a JWT access token
        for DMS API access. The token will contain the required scope and
        customerid claim for accessing DMS data endpoints.
      operationId: ExchangeClientCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
        required: true
      responses:
