            3. Add random jitter (±25%) to each delay to avoid thundering-herd effects.
            4. Set a maximum of 5 retries (or ~30 seconds total wait) before aborting.

            Example (pseudocode):
            ```
            delay = max(retryAfterHeader, 1)
            for attempt in 1..5:
                sleep(delay * (0.75 + random(0, 0.5)))
                response = retry(request)
                if response.status != 429: break
                delay = delay * 2
            ```
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
  /api/v1/dms/users:
    get:
      tags:
      - DMS
      summary: Get all users
      description: |-
        Returns all users updated within the specified time range.
        Both changed_since and changed_until are required for delta synchronization.
      operationId: GetUsers
      parameters:
      - name: changed_since
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: changed_until
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per 1 minute
              schema:
                type: integer
              example: 100
            X-RateLimit-Remaining:
              description: Remaining requests in current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the rate limit resets
              schema:
                type: integer
                format: int64
            Link:
