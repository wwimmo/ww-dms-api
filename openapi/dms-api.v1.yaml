          format: uuid
        creditorid:
          type: string
          format: uuid
        bookkeepingid:
          type: string
          format: uuid
        accountnumber:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
      additionalProperties: false
      description: DMS REST response shape for a single accounting history entry (Kontierungshistorie)
        from the ERP (frozen wire contract for the external DMS consumer).
    AccountingHistoryResponsePaginatedResponse:
      type: object
      properties:
