      tags:
      - TenancyPerson
      summary: Lists tenancy-to-person assignments (with role) changed in the given window, paginated.
      parameters:
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: changed_until
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TenancyPersonResponsePaginatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyPersonResponsePaginatedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TenancyPersonResponsePaginatedResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/dms/tenants:
    get:
      tags:
      - Tenant
      summary: Lists tenants changed in the given window, paginated.
      parameters:
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: changed_until
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantResponsePaginatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponsePaginatedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantResponsePaginatedResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/dms/token:
    post:
      tags:
      - Token
      summary: Exchanges client credentials for a Cidaas access token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TokenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Server Error
  /api/v1/dms/units:
    get:
      tags:
      - Unit
      summary: Lists units changed in the given window, paginated.
      parameters:
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: changed_until
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UnitResponsePaginatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UnitResponsePaginatedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UnitResponsePaginatedResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/dms/vat-codes:
    get:
      tags:
      - VatCode
      summary: Lists all VAT codes; the delta window is accepted but not applied.
      description: |-
        The delta window is accepted for contract symmetry but not applied: the ERP source of this list
        carries no change timestamps, so every call returns the full set. Poll on a slow schedule and diff
        locally instead of relying on `changed_since`.
      parameters:
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: changed_until
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/VatCodeResponsePaginatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/VatCodeResponsePaginatedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/VatCodeResponsePaginatedResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AccountCostCenterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountid:
          type: string
          format: uuid
        costcenterid:
          type: string
          format: uuid
        validfrom:
          type: string
          nullable: true
        validto:
          type: string
          nullable: true
      additionalProperties: false
      description: |-
        DMS REST response shape for an ERP account-cost center assignment
                    (Konti-Kostenstellen-Zuweisung; frozen wire contract for the external DMS consumer).
    AccountCostCenterResponsePaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountCostCenterResponse'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        pageCount:
          type: integer
          description: Total number of pages for the current page size.
          format: int32
          readOnly: true
      additionalProperties: false
      description: Paginated REST envelope returned by the DMS BFF to its external consumer.
    AccountRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/AccountType'
        validfrom:
          type: string
          nullable: true
        validto:
          type: string
          nullable: true
        bookkeepingid:
          type: string
          nullable: true
        tenantid:
          type: string
          nullable: true
        requirescostcenter:
          type: boolean
        requiresquantitiy:
          type: boolean
        unitofmeasure:
          $ref: '#/components/schemas/UnitOfMeasure'
        vatconfig:
          $ref: '#/components/schemas/VatConfig'
        defaultvatcodeid:
          type: string
          nullable: true
        extracostdate:
          type: boolean
      additionalProperties: false
      description: Request contract for creating an ERP account. JSON keys pinned to the published contract.
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/AccountType'
        validfrom:
          type: string
          nullable: true
        validto:
          type: string
          nullable: true
        bookkeepingid:
          type: string
          format: uuid
        tenantid:
          type: string
          format: uuid
          nullable: true
        requirescostcenter:
          type: boolean
        requiresquantitiy:
          type: boolean
        unitofmeasure:
          $ref: '#/components/schemas/UnitOfMeasure'
        vatconfig:
          $ref: '#/components/schemas/VatConfig'
        defaultvatcodeid:
          type: string
          format: uuid
          nullable: true
        closed:
          type: boolean
        extracostdate:
          type: boolean
      additionalProperties: false
      description: DMS REST response shape for an ERP account (Konto/Zahlstelle) — frozen wire contract
        for the external DMS consumer.
    AccountResponsePaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        pageCount:
          type: integer
          description: Total number of pages for the current page size.
          format: int32
          readOnly: true
      additionalProperties: false
      description: Paginated REST envelope returned by the DMS BFF to its external consumer.
    AccountType:
      enum:
      - Cost
      - Debtor
      - GeneralLedger
      - Cooperative
      type: string
      description: |-
        Account type (Kontotyp) exposed on the DMS wire as a speaking enum instead of the raw ERP code.
        Backed by cred enumeration key 855 (`cred.accounttype`). The numeric code stays in the DB/ERP
        and is mapped to/from this enum in the DMS UseCases layer only (#22269).
        Members and codes mirror the mobile.wiki page "cred enumerations" (page 394), the source of truth.
    AccountingHistoryResponse:
      type: object
      properties:
