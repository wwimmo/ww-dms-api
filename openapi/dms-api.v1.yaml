            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Invoice
      summary: Hands an invoice to the KrediFlow visa workflow. The file content stays in the DMS.
      description: |-
        `fileId` names a previously archived document (`POST /documents`); only the id travels, never
                    the file. Validation errors come back as <c>{ "isValid": false, "errors": [{ "field", "code",
                    "message" }] }</c> — a different shape from the problem-details used elsewhere, because the codes are
                    the ERP's contract. A retry after a timeout creates a second invoice; there is no idempotency key yet.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InvoiceCreateResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreateResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreateResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
